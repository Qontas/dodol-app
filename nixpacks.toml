# Konfigurasi build & start Railway (Nixpacks) untuk dodol-app.
# Catatan: `php artisan filament:assets` TIDAK dijalankan di sini — aset Filament
# sudah ter-commit di public/css/filament & public/js/filament (begitu juga Leaflet
# lokal di public/vendor/leaflet). Hanya aset Vite (public/build) yang di-build saat
# deploy karena di-gitignore.

[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.gd",
    "php82Extensions.opcache",
    "php82Extensions.pdo",
    "curl",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mbstring",
    "php82Extensions.tokenizer",
    "php82Extensions.xml",
    "php82Extensions.ctype",
    "php82Extensions.bcmath",
    "php82Extensions.curl",
    "php82Extensions.zip",
    "php82Extensions.fileinfo",
    "php82Extensions.intl",
    "php82Packages.composer",
    "nodejs_20",
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --prefer-dist",
    "npm ci",
    "npm run build",
]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan event:cache",
    # FASE 2 (retry hardened) — Octane + FrankenPHP worker mode.
    # PIN FrankenPHP v1.11.0 = PHP 8.4.16 (terakhir 8.4; v1.12 sudah 8.5 yg belum
    # didukung Laravel 11). >=1.5.0 → Octane pakai binari ini, tak unduh-ulang.
    "curl -fsSL -o frankenphp https://github.com/php/frankenphp/releases/download/v1.11.0/frankenphp-linux-x86_64",
    "chmod +x frankenphp",
]

# Seeding TIDAK di sini (manual sekali setelah deploy pertama biar tak overwrite data).
#
# SERVER: Laravel Octane + FrankenPHP worker mode. config/octane.php = default
# (FlushAuthenticationState+FlushSessionState+PrepareLivewireForNextOperation utuh).
#
# HARDENING (retry — fix 502 deploy sebelumnya): FrankenPHP memakai Caddy yang BUTUH
# direktori tulis untuk state/config. Di container Railway HOME bisa unset/non-writable
# → Caddy gagal start → 502. Maka: mkdir + arahkan HOME/XDG_CONFIG_HOME/XDG_DATA_HOME
# ke /tmp (selalu writable). --workers=2 EKSPLISIT (hindari kemungkinan deteksi 'auto'
# meleset di container). OPcache via PHP_INI_SCAN_DIR (php-ini/opcache.ini) diwariskan
# ke proses frankenphp anak; FrankenPHP server SAPI sudah opcache.enable=1 default.
#
# ⏪ ROLLBACK ≤2 menit kalau 502 lagi: balik baris [start] ke `php artisan serve`
# (commit known-good 9d6de13 / bf6da5b) lalu redeploy. App belum operasional → aman.
[start]
cmd = "mkdir -p /tmp/fp/config /tmp/fp/data && php artisan migrate --force && php artisan storage:link && HOME=/tmp/fp XDG_CONFIG_HOME=/tmp/fp/config XDG_DATA_HOME=/tmp/fp/data PHP_INI_SCAN_DIR=\"$PWD/php-ini\" php artisan octane:frankenphp --host=0.0.0.0 --port=$PORT --workers=2 --max-requests=500"
