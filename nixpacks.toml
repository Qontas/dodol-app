# Konfigurasi build & start Railway (Nixpacks) untuk dodol-app.
# Catatan: `php artisan filament:assets` TIDAK dijalankan di sini — aset Filament
# sudah ter-commit di public/css/filament & public/js/filament (begitu juga Leaflet
# lokal di public/vendor/leaflet). Hanya aset Vite (public/build) yang di-build saat
# deploy karena di-gitignore.

[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.gd",
    "php82Extensions.opcache",
    "php82Extensions.pdo",
    "curl",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mbstring",
    "php82Extensions.tokenizer",
    "php82Extensions.xml",
    "php82Extensions.ctype",
    "php82Extensions.bcmath",
    "php82Extensions.curl",
    "php82Extensions.zip",
    "php82Extensions.fileinfo",
    "php82Extensions.intl",
    "php82Packages.composer",
    "nodejs_20",
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --prefer-dist",
    "npm ci",
    "npm run build",
]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan event:cache",
    # FASE 2 — Server produksi: Laravel Octane + FrankenPHP (worker mode).
    # PIN versi: FrankenPHP v1.11.0 mem-bundle PHP 8.4.16 (Laravel 11 supported).
    # CATATAN versi PHP: target awal 8.3, TAPI Octane 2.17 mensyaratkan FrankenPHP
    # >= 1.5.0, sedangkan FrankenPHP terakhir yang mem-bundle 8.3 = v1.2.5 (< 1.5.0)
    # → Octane akan menolak & meng-unduh-ulang rilis TERBARU (v1.12 = PHP 8.5) yang
    # BELUM didukung Laravel 11. Maka dipilih v1.11.0 = FrankenPHP terakhir yang
    # masih PHP 8.4 (rilis >= 1.11.3 sudah 8.5). 8.4 = versi STABIL & didukung
    # Laravel 11, dan menghindari 8.5. Binari diunduh ke base_path → octane:frankenphp
    # memakainya (>=1.5.0 jadi TIDAK di-unduh-ulang). `frankenphp` ada di .gitignore.
    "curl -fsSL -o frankenphp https://github.com/php/frankenphp/releases/download/v1.11.0/frankenphp-linux-x86_64",
    "chmod +x frankenphp",
]

# Seeding TIDAK di sini (manual sekali setelah deploy pertama biar tak overwrite data).
#
# SERVER: Laravel Octane + FrankenPHP worker mode (request paralel, app tak
# re-bootstrap tiap request). config/octane.php = default (listener reset auth/
# session FlushAuthenticationState+FlushSessionState+PrepareLivewireForNextOperation
# UTUH → isolasi multi-tenant terjaga; sudah lolos gate isolasi lokal 240/0).
#
# OPcache: FrankenPHP server SAPI sudah opcache.enable=1 default; di-pertegas +
# tuning produksi lewat php-ini/opcache.ini yang di-load via PHP_INI_SCAN_DIR
# (env diwariskan ke proses frankenphp anak). validate_timestamps=0 = tak cek file.
#
# ROLLBACK cepat (≤2 menit): kembalikan baris [start] ini ke `php artisan serve`
# (lihat commit bf6da5b) lalu redeploy — server balik single-thread, tanpa ubah app.
[start]
cmd = "php artisan migrate --force && php artisan storage:link && PHP_INI_SCAN_DIR=\"$PWD/php-ini\" php artisan octane:frankenphp --host=0.0.0.0 --port=$PORT --workers=auto --max-requests=500"
