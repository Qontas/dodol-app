# Konfigurasi build & start Railway (Nixpacks) untuk dodol-app.
# Catatan: `php artisan filament:assets` TIDAK dijalankan di sini — aset Filament
# sudah ter-commit di public/css/filament & public/js/filament (begitu juga Leaflet
# lokal di public/vendor/leaflet). Hanya aset Vite (public/build) yang di-build saat
# deploy karena di-gitignore.

[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.gd",
    "php82Extensions.opcache",
    "php82Extensions.pdo",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mbstring",
    "php82Extensions.tokenizer",
    "php82Extensions.xml",
    "php82Extensions.ctype",
    "php82Extensions.bcmath",
    "php82Extensions.curl",
    "php82Extensions.zip",
    "php82Extensions.fileinfo",
    "php82Extensions.intl",
    "php82Packages.composer",
    "nodejs_20",
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --prefer-dist",
    "npm ci",
    "npm run build",
]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan event:cache",
]

# Seeding TIDAK di sini (manual sekali setelah deploy pertama biar tak overwrite data).
#
# OPcache: server tetap `php artisan serve` (penggantian server = FASE 2 terpisah).
# Karena artisan serve berjalan di SAPI CLI, opcache butuh `opcache.enable_cli=1`
# agar aktif. Proses serve hidup terus (long-lived) → opcode ter-cache & dipakai
# ulang lintas request (validate_timestamps=0: tak cek ulang file di produksi).
[start]
cmd = "php artisan migrate --force && php artisan storage:link && php -d opcache.enable=1 -d opcache.enable_cli=1 -d opcache.validate_timestamps=0 -d opcache.memory_consumption=128 -d opcache.max_accelerated_files=10000 artisan serve --host=0.0.0.0 --port=$PORT"
