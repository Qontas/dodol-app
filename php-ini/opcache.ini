; OPcache untuk FrankenPHP (PHP 8.3) di mode worker Octane.
; Di-load lewat PHP_INI_SCAN_DIR yang di-set di [start] nixpacks.toml.
; FrankenPHP server SAPI sudah opcache.enable=1 secara default; file ini
; menegaskan + menyetel untuk produksi (tak cek ulang timestamp file).
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.fast_shutdown=1
