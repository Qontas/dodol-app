; Batas upload foto kios (produksi FrankenPHP/Octane di Railway).
;
; KENAPA FILE INI ADA: image `dunglas/frankenphp` berbasis image `php` resmi, yang
; TIDAK mengaktifkan php.ini apa pun (php.ini-production cuma disediakan, tak dipakai)
; → PHP jatuh ke default bawaannya: upload_max_filesize=2M, post_max_size=8M. Selama
; ini tak pernah kelihatan karena foto sudah dikompres jadi ~200KB di browser, jadi
; tak pernah menyentuh langit-langit 2M itu. Tapi foto HEIC dikirim MENTAH (browser
; Android tak bisa decode HEIC → server yang konversi), ukurannya bisa 2–5MB → BISA
; menabrak batas 2M dan gagal di level PHP, SEBELUM Laravel sempat memberi pesan yang
; masuk akal. Jadi batasnya di-set EKSPLISIT di sini, bukan diwariskan dari bawaan image.
;
; ANGKA: plafon aplikasi = 20MB (validasi Laravel + Livewire). Nilai PHP di bawah ini
; sengaja SEDIKIT DI ATAS itu supaya file 20MB yang sah ditolak oleh validasi Laravel
; dengan PESAN YANG JELAS, bukan mati diam-diam di level PHP (post_max_size terlampaui
; = request kosong, $_FILES kosong, tanpa pesan berguna). post_max_size >
; upload_max_filesize karena badan request memuat file + field lain + overhead multipart.
upload_max_filesize = 24M
post_max_size = 28M

; Decode foto besar (GD di ImageResizer, Imagick saat konversi HEIC) butuh memori
; lebih dari default 128M. ImageResizer menaikkan sendiri saat perlu (maks 384M) lalu
; memulihkannya, tapi basis yang lebih lega mengurangi kejadian itu di mode worker.
memory_limit = 256M
