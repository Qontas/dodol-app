<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F59E0B">
    <title>Offline — Cemilan Qontas</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 24px;
        }
        .card {
            max-width: 360px;
            text-align: center;
        }
        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #fff;
            font-size: 40px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #475569; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
        button {
            background: #F59E0B;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { background: #D97706; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Q</div>
        <h1>Kamu sedang offline</h1>
        <p>Cemilan Qontas butuh koneksi internet untuk memuat halaman ini. Cek sinyal atau Wi-Fi kamu, lalu coba lagi.</p>
        <button onclick="location.reload()">Coba lagi</button>
    </div>
</body>
</html>
