# Konfigurasi Railway untuk dodol-app.
# FASE 2: build via Dockerfile (Octane + FrankenPHP, image resmi PHP 8.4).
# ROLLBACK ke artisan serve (known-good): ganti builder balik ke "nixpacks"
# (nixpacks.toml sengaja dipertahankan) lalu redeploy — 1 langkah.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[healthcheck]
httpPath = "/login"
intervalSeconds = 30
timeoutSeconds = 10
